services:
  backend:
    build: ./Backend
    container_name: url-shortener-backend
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 5001

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    ports:
      - "5173:4173"
    depends_on:
      - backend